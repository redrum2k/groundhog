[project]
name = "order-to-cash-backend"
version = "0.3.0"
description = "CalHacks catalog requirements, evidence repair and gated mock settlement"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40,<1",
  "eth-account>=0.13,<0.14",
  "fastapi>=0.115,<1",
  "langgraph>=1,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "reportlab>=4,<5",
  "uvicorn>=0.30,<1",
  "web3>=7,<8",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
